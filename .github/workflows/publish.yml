name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.package_slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_slug: agentic-proteins
            package_dir: packages/agentic-proteins
            artifacts_dir: artifacts/agentic-proteins
            build_targets: "build sbom"
          - package_slug: bijux-proteomics-foundation
            package_dir: packages/bijux-proteomics-foundation
            artifacts_dir: artifacts/bijux-proteomics-foundation
            build_targets: "build sbom"
          - package_slug: bijux-proteomics-core
            package_dir: packages/bijux-proteomics-core
            artifacts_dir: artifacts/bijux-proteomics-core
            build_targets: "build sbom"
          - package_slug: bijux-proteomics-intelligence
            package_dir: packages/bijux-proteomics-intelligence
            artifacts_dir: artifacts/bijux-proteomics-intelligence
            build_targets: "build sbom"
          - package_slug: bijux-proteomics-knowledge
            package_dir: packages/bijux-proteomics-knowledge
            artifacts_dir: artifacts/bijux-proteomics-knowledge
            build_targets: "build sbom"
          - package_slug: bijux-proteomics-lab
            package_dir: packages/bijux-proteomics-lab
            artifacts_dir: artifacts/bijux-proteomics-lab
            build_targets: "build sbom"
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      package_slug: ${{ matrix.package_slug }}
      package_dir: ${{ matrix.package_dir }}
      artifacts_dir: ${{ matrix.artifacts_dir }}
      build_targets: ${{ matrix.build_targets || 'build' }}
      dist_subdir: ${{ matrix.dist_subdir || 'build' }}

  publish_pypi:
    name: publish-pypi
    needs: build
    uses: ./.github/workflows/release-pypi.yml
    with:
      enabled: true
      mode: artifact
      package_matrix_json: >-
        [{"package_slug":"agentic-proteins","publish_auth":"trusted"},{"package_slug":"bijux-proteomics-foundation","publish_auth":"trusted"},{"package_slug":"bijux-proteomics-core","publish_auth":"trusted"},{"package_slug":"bijux-proteomics-intelligence","publish_auth":"trusted"},{"package_slug":"bijux-proteomics-knowledge","publish_auth":"trusted"},{"package_slug":"bijux-proteomics-lab","publish_auth":"trusted"}]
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  publish_ghcr:
    name: publish-ghcr
    needs: build
    uses: ./.github/workflows/release-ghcr.yml
    with:
      enabled: true
      package_matrix_json: >-
        [{"package_slug":"agentic-proteins"},{"package_slug":"bijux-proteomics-foundation"},{"package_slug":"bijux-proteomics-core"},{"package_slug":"bijux-proteomics-intelligence"},{"package_slug":"bijux-proteomics-knowledge"},{"package_slug":"bijux-proteomics-lab"}]
    permissions:
      contents: read
      packages: write
    secrets: inherit

  release:
    name: github-release
    needs:
      - build
      - publish_pypi
      - publish_ghcr
    permissions:
      contents: write
    uses: ./.github/workflows/release-github.yml
    with:
      artifact_pattern: "*-release"
      artifact_path: .github/tmp/release-assets
      release_files_glob: .github/tmp/release-assets/**/*
      fail_on_unmatched_files: true
