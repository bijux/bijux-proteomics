name: publish-agentic-proteins

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      package_slug: agentic-proteins
      cache_dependency_path: |
        pyproject.toml
      build_targets: "build sbom"
      upload_paths: |
        artifacts/build/*
        artifacts/sbom/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@v5
        with:
          name: agentic-proteins-pypi-dist
          path: .github/tmp/agentic-proteins-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: .github/tmp/agentic-proteins-dist
          skip-existing: true
