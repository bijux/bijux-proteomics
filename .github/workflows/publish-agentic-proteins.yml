name: publish-agentic-proteins

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      package_slug: agentic-proteins
      cache_dependency_path: |
        pyproject.toml
        packages/agentic-proteins/pyproject.toml
      build_targets: "build-agentic-proteins sbom"
      package_dir: "packages/agentic-proteins"
      dist_subdir: "build/agentic-proteins"
      upload_paths: |
        artifacts/build/agentic-proteins/*
        artifacts/sbom/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@v5
        with:
          name: agentic-proteins-pypi-dist
          path: .github/tmp/agentic-proteins-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .github/tmp/agentic-proteins-dist
          skip-existing: true
