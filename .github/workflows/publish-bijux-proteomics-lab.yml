name: publish-bijux-proteomics-lab

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      package_slug: bijux-proteomics-lab
      cache_dependency_path: |
        pyproject.toml
        packages/bijux-proteomics-lab/pyproject.toml
      build_targets: "build-bijux-proteomics-lab"
      package_dir: "packages/bijux-proteomics-lab"
      dist_subdir: "build/bijux-proteomics-lab"
      upload_paths: |
        artifacts/build/bijux-proteomics-lab/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@v5
        with:
          name: bijux-proteomics-lab-pypi-dist
          path: .github/tmp/bijux-proteomics-lab-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .github/tmp/bijux-proteomics-lab-dist
          skip-existing: true
