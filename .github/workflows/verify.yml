            artifacts_dir: artifacts/proteomics
            check_targets: "[\"quality\", \"security\", \"docs\", \"build\", \"sbom\"]"
          - package_slug: proteomics-core
            package_dir: packages/proteomics-core
            artifacts_dir: artifacts/proteomics-core
            check_targets: "[\"quality\", \"security\", \"docs\", \"build\", \"sbom\"]"
          - package_slug: proteomics-foundation
            package_dir: packages/proteomics-foundation
            artifacts_dir: artifacts/proteomics-foundation
            check_targets: "[\"quality\", \"security\", \"docs\", \"build\", \"sbom\"]"
          - package_slug: proteomics-runtime
            package_dir: packages/proteomics-runtime
            artifacts_dir: artifacts/proteomics-runtime
            check_targets: "[\"quality\", \"security\", \"docs\", \"build\", \"sbom\"]"
          - package_slug: proteomics-intelligence
            package_dir: packages/proteomics-intelligence
            artifacts_dir: artifacts/proteomics-intelligence
            check_targets: "[\"quality\", \"security\", \"docs\", \"build\", \"sbom\"]"
          - package_slug: proteomics-knowledge
