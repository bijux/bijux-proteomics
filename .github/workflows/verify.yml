name: verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "apis/**"
      - "configs/**"
      - "docs/**"
      - "makes/**"
      - "packages/**"
      - "Makefile"
      - "mkdocs.shared.yml"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "tox.ini"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "apis/**"
      - "configs/**"
      - "docs/**"
      - "makes/**"
      - "packages/**"
      - "Makefile"
      - "mkdocs.shared.yml"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "tox.ini"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify repository automation contracts
        shell: bash
        run: |
          set -euo pipefail
          make check-shared-bijux-py check-config-layout check-make-layout help

  package:
    name: ${{ matrix.package_slug }}
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        include:
          # Non-dev packages inherit the shared docs/api/build/security/sbom surface.
          - package_slug: agentic-proteins
            package_dir: packages/agentic-proteins
            artifacts_dir: artifacts/agentic-proteins
          - package_slug: bijux-proteomics-foundation
            package_dir: packages/bijux-proteomics-foundation
            artifacts_dir: artifacts/bijux-proteomics-foundation
          - package_slug: bijux-proteomics-core
            package_dir: packages/bijux-proteomics-core
            artifacts_dir: artifacts/bijux-proteomics-core
          - package_slug: bijux-proteomics-intelligence
            package_dir: packages/bijux-proteomics-intelligence
            artifacts_dir: artifacts/bijux-proteomics-intelligence
          - package_slug: bijux-proteomics-knowledge
            package_dir: packages/bijux-proteomics-knowledge
            artifacts_dir: artifacts/bijux-proteomics-knowledge
          - package_slug: bijux-proteomics-lab
            package_dir: packages/bijux-proteomics-lab
            artifacts_dir: artifacts/bijux-proteomics-lab
          - package_slug: bijux-proteomics-dev
            package_dir: packages/bijux-proteomics-dev
            artifacts_dir: artifacts/bijux-proteomics-dev
            check_targets: '["quality", "security", "build", "sbom"]'
    uses: ./.github/workflows/ci-package.yml
    with:
      package_slug: ${{ matrix.package_slug }}
      package_dir: ${{ matrix.package_dir }}
      artifacts_dir: ${{ matrix.artifacts_dir }}
      test_python_versions: ${{ matrix.test_python_versions || '["3.11"]' }}
      check_targets: ${{ matrix.check_targets || '["quality", "security", "docs", "api", "openapi-drift", "build", "sbom"]' }}
      api_toolchain_targets: ${{ matrix.api_toolchain_targets || '["api", "openapi-drift"]' }}
      post_test_command: ${{ matrix.post_test_command || '' }}
