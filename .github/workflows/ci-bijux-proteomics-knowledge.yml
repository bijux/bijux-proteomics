name: ci-bijux-proteomics-knowledge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-bijux-proteomics-knowledge.yml"
      - ".github/workflows/ci-package.yml"
      - "packages/bijux-proteomics-knowledge/**"
      - "configs/**"
      - "makes/**"
      - "Makefile"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/ci-bijux-proteomics-knowledge.yml"
      - ".github/workflows/ci-package.yml"
      - "packages/bijux-proteomics-knowledge/**"
      - "configs/**"
      - "makes/**"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-package.yml
    with:
      package_slug: bijux-proteomics-knowledge
      cache_dependency_path: |
        pyproject.toml
      test_paths: packages/bijux-proteomics-knowledge/tests
      lint_dirs: packages/bijux-proteomics-knowledge/src/bijux_proteomics_knowledge
      quality_paths: packages/bijux-proteomics-knowledge/src/bijux_proteomics_knowledge
      build_target: build-bijux-proteomics-knowledge
