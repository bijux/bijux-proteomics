  "packages/bijux-proteomics-foundation/src",
  "packages/bijux-proteomics-core/src",
  "packages/bijux-proteomics-knowledge/src",
  "packages/bijux-proteomics-intelligence/src",
  "packages/bijux-proteomics-lab/src",
]

