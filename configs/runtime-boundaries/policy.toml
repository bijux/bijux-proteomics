  "packages/bijux-proteomics-foundation/src/bijux_proteomics_foundation",
  "packages/bijux-proteomics-core/src/bijux_proteomics",
  "packages/bijux-proteomics-knowledge/src/bijux_proteomics_knowledge",
  "packages/bijux-proteomics-intelligence/src/bijux_proteomics_intelligence",
  "packages/bijux-proteomics-lab/src/bijux_proteomics_lab",
]
runtime_type_overlap_allowlist_path = "configs/runtime-boundaries/runtime-type-overlap-allowlist.txt"
