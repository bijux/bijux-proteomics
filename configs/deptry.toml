extend_exclude = ["docs", "apis", "artifacts", "site"]
package_module_name_map = { "langchain-core" = "langchain_core", "langchain-community" = "langchain_community", "langchain-huggingface" = "langchain_huggingface", "openprotein-python" = "openprotein", "mkdocs-autorefs" = "mkdocs_autorefs", "mkdocs-git-revision-date-localized-plugin" = "mkdocs_git_revision_date_localized_plugin" }

