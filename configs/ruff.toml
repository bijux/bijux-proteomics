target-version = "py311"
line-length = 88
respect-gitignore = true
cache-dir = "artifacts/root/ruff-cache"
src = [
  "packages/agentic-proteins/src",
  "packages/agentic-proteins/tests",
  "packages/bijux-proteomics/src",
  "packages/bijux-proteomics/tests",
  "packages/bijux-proteomics-core/src",
  "packages/bijux-proteomics-core/tests",
  "packages/bijux-proteomics-dev/src",
  "packages/bijux-proteomics-dev/tests",
  "packages/bijux-proteomics-foundation/src",
  "packages/bijux-proteomics-foundation/tests",
  "packages/bijux-proteomics-intelligence/src",
  "packages/bijux-proteomics-intelligence/tests",
  "packages/bijux-proteomics-knowledge/src",
  "packages/bijux-proteomics-knowledge/tests",
  "packages/bijux-proteomics-lab/src",
  "packages/bijux-proteomics-lab/tests",
  "packages/bijux-proteomics-runtime/src",
  "packages/bijux-proteomics-runtime/tests",
  "packages/proteomics/src",
  "packages/proteomics/tests",
  "packages/proteomics-core/src",
  "packages/proteomics-core/tests",
  "packages/proteomics-foundation/src",
  "packages/proteomics-foundation/tests",
  "packages/proteomics-intelligence/src",
  "packages/proteomics-intelligence/tests",
  "packages/proteomics-knowledge/src",
  "packages/proteomics-knowledge/tests",
  "packages/proteomics-lab/src",
  "packages/proteomics-lab/tests",
  "packages/proteomics-runtime/src",
  "packages/proteomics-runtime/tests",
]
exclude = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "artifacts",
  "build",
  "dist",
  "docs/report",
  "htmlcov",
  "__pycache__",
  "migrations",
  "node_modules",
  "*.egg-info",
  "site",
]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "ISC"]
ignore = ["E501", "E203"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[lint.isort]
force-sort-within-sections = true
known-first-party = [
  "agentic_proteins",
  "agentic_proteins_testsupport",
  "bijux_proteomics_alias",
  "bijux_proteomics",
  "bijux_proteomics_dev",
  "bijux_proteomics_foundation",
  "bijux_proteomics_intelligence",
  "bijux_proteomics_knowledge",
  "bijux_proteomics_lab",
  "bijux_proteomics_runtime",
  "proteomics",
  "proteomics_core",
  "proteomics_foundation",
  "proteomics_intelligence",
  "proteomics_knowledge",
  "proteomics_lab",
  "proteomics_runtime",
  "tests",
]

[lint.mccabe]
max-complexity = 10
