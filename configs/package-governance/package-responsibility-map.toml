# Generated package responsibility map.
# Regenerate with: ./.venv/bin/python -m bijux_proteomics_dev.governance.dependencies.package_responsibility_map

[guard]
max_foundation_higher_package_edges = 0
max_knowledge_runtime_edges = 0
max_core_cli_edges = 0

[[package]]
distribution_name = "agentic-proteins"
import_root = "agentic_proteins"
responsibility_kind = "compatibility_bridge"
reason_to_exist = "forward legacy import and packaging expectations into the canonical core and runtime owners without reviving a second scientific source of truth"
must_not_absorb = "independent scientific logic, new review behavior, or original workflow engines"
canonical_surface_targets = ["bijux-proteomics-core", "bijux-proteomics-runtime"]

[[package]]
distribution_name = "bijux-proteomics-dev"
import_root = "bijux_proteomics_dev"
responsibility_kind = "governance"
reason_to_exist = "own maintainer governance, release checks, architecture audits, and package-shape validation across the repository"
must_not_absorb = "scientific product behavior, runtime execution, or compatibility alias logic"
canonical_surface_targets = ["bijux-proteomics-dev"]

[[package]]
distribution_name = "bijux-proteomics-foundation"
import_root = "bijux_proteomics_foundation"
responsibility_kind = "foundation"
reason_to_exist = "centralize shared document primitives, deterministic serialization, identifiers, compatibility, and stable outcome contracts for every higher package"
must_not_absorb = "scientific policy, evidence memory, workflow orchestration, lab execution, runtime transport, or CLI behavior"
canonical_surface_targets = ["bijux-proteomics-foundation"]

[[package]]
distribution_name = "bijux-proteomics-core"
import_root = "bijux_proteomics"
responsibility_kind = "core"
reason_to_exist = "own canonical scientific semantics, review artifacts, benchmark evidence, workflow seams, and the flagship Python and CLI product surface"
must_not_absorb = "wrapper-only install behavior, runtime transport ownership, or judgment-only policy that belongs in intelligence"
canonical_surface_targets = ["bijux-proteomics-core"]

[[package]]
distribution_name = "bijux-proteomics-runtime"
import_root = "bijux_proteomics_runtime"
responsibility_kind = "runtime"
reason_to_exist = "own execution, persistence, replay, resumability, handoff, and artifact-valid scientific workflow runtime behavior"
must_not_absorb = "canonical scientific law, evidence memory ownership, or wrapper distribution behavior"
canonical_surface_targets = ["bijux-proteomics-runtime"]

[[package]]
distribution_name = "bijux-proteomics-intelligence"
