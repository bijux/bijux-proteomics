[mypy]
python_version = 3.11
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
namespace_packages = true
plugins = pydantic.mypy
mypy_path = packages/agentic-proteins/src:packages/bijux-proteomics/src:packages/bijux-proteomics-core/src:packages/bijux-proteomics-dev/src:packages/bijux-proteomics-foundation/src:packages/bijux-proteomics-intelligence/src:packages/bijux-proteomics-knowledge/src:packages/bijux-proteomics-lab/src:packages/bijux-proteomics-runtime/src:packages/proteomics/src:packages/proteomics-core/src:packages/proteomics-foundation/src:packages/proteomics-intelligence/src:packages/proteomics-knowledge/src:packages/proteomics-lab/src:packages/proteomics-runtime/src
exclude = ^(\.venv|build|dist|docs|htmlcov|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.tox|__pycache__|migrations|\.egg-info|node_modules|artifacts|site)/

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
