[mypy]
python_version = 3.11
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
namespace_packages = false
plugins = pydantic.mypy
mypy_path = packages/agentic-proteins/src:packages/bijux-proteomics-core/src:packages/bijux-proteomics-dev/src:packages/bijux-proteomics-foundation/src:packages/bijux-proteomics-intelligence/src:packages/bijux-proteomics-knowledge/src:packages/bijux-proteomics-lab/src:packages/bijux-proteomics-runtime/src
files = packages/agentic-proteins/src, packages/agentic-proteins/tests, packages/bijux-proteomics-core/src, packages/bijux-proteomics-core/tests, packages/bijux-proteomics-dev/src, packages/bijux-proteomics-dev/tests, packages/bijux-proteomics-foundation/src, packages/bijux-proteomics-foundation/tests, packages/bijux-proteomics-intelligence/src, packages/bijux-proteomics-intelligence/tests, packages/bijux-proteomics-knowledge/src, packages/bijux-proteomics-knowledge/tests, packages/bijux-proteomics-lab/src, packages/bijux-proteomics-lab/tests, packages/bijux-proteomics-runtime/src, packages/bijux-proteomics-runtime/tests
exclude = ^(\.venv|build|dist|docs|htmlcov|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.tox|__pycache__|migrations|\.egg-info|node_modules|artifacts|site)/

[mypy-agentic_proteins.*]
ignore_errors = true

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
