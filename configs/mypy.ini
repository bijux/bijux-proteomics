[mypy]
python_version = 3.11
strict = true

show_error_codes = true
pretty = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
follow_imports = silent

mypy_path = packages/agentic-proteins/src:packages/bijux-proteomics-foundation/src:packages/bijux-proteomics-core/src:packages/bijux-proteomics-intelligence/src:packages/bijux-proteomics-knowledge/src:packages/bijux-proteomics-lab/src
files = packages/agentic-proteins/src, packages/bijux-proteomics-foundation/src, packages/bijux-proteomics-core/src, packages/bijux-proteomics-intelligence/src, packages/bijux-proteomics-knowledge/src, packages/bijux-proteomics-lab/src, packages/agentic-proteins/tests, packages/bijux-proteomics-foundation/tests, packages/bijux-proteomics-core/tests, packages/bijux-proteomics-intelligence/tests, packages/bijux-proteomics-knowledge/tests, packages/bijux-proteomics-lab/tests

exclude = ^(\.venv|build|dist|docs|htmlcov|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.tox|__pycache__|migrations|\.egg-info|node_modules)/

plugins = pydantic.mypy

[pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[mypy-agentic_proteins.*]
ignore_errors = true
