strict: true
use_directory_urls: true
dev_addr: 127.0.0.1:8000

validation:
  omitted_files: ignore

theme:
  name: material
  language: en
  logo: assets/bijux_logo_hq.png
  favicon: assets/site-icons/favicon.ico
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme)"
      primary: teal
      accent: cyan
      toggle:
        icon: material/theme-light-dark
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/moon-waning-crescent
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/white-balance-sunny
        name: Switch to system mode

plugins:
  - search
  - autorefs
  - redirects:
      redirect_maps:
        bijux-proteomics-dev/index.md: 08-bijux-proteomics-maintain/index.md
        bijux-proteomics-dev/package-overview.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/package-overview.md
        bijux-proteomics-dev/scope-and-non-goals.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/scope-and-non-goals.md
        bijux-proteomics-dev/module-map.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/module-map.md
        bijux-proteomics-dev/operating-guidelines.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/operating-guidelines.md
        bijux-proteomics-dev/quality-gates.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/quality-gates.md
        bijux-proteomics-dev/security-gates.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/security-gates.md
        bijux-proteomics-dev/schema-governance.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/schema-governance.md
        bijux-proteomics-dev/release-support.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/release-support.md
        bijux-proteomics-dev/documentation-integrity.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/documentation-integrity.md
        bijux-proteomics-dev/foundation.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/package-overview.md
        bijux-proteomics-dev/architecture.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/module-map.md
        bijux-proteomics-dev/interfaces.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/module-map.md
        bijux-proteomics-dev/operations.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/operating-guidelines.md
        bijux-proteomics-dev/tooling-map.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/module-map.md
        bijux-proteomics-dev/quality.md: 08-bijux-proteomics-maintain/bijux-proteomics-dev/quality-gates.md
        bijux-proteomics/platform-overview.md: 01-bijux-proteomics/foundation/platform-overview.md
        bijux-proteomics/repository-scope.md: 01-bijux-proteomics/foundation/repository-scope.md
        bijux-proteomics/workspace-layout.md: 01-bijux-proteomics/foundation/workspace-layout.md
        bijux-proteomics/package-map.md: 01-bijux-proteomics/foundation/package-map.md
        bijux-proteomics/documentation-system.md: 01-bijux-proteomics/foundation/documentation-system.md
        bijux-proteomics/api-and-schema-governance.md: 01-bijux-proteomics/operations/api-and-schema-governance.md
        bijux-proteomics/apis.md: 01-bijux-proteomics/operations/api-and-schema-governance.md
        bijux-proteomics/local-development.md: 01-bijux-proteomics/operations/local-development.md
        bijux-proteomics/testing-and-validation.md: 01-bijux-proteomics/operations/testing-and-validation.md
        bijux-proteomics/release-and-versioning.md: 01-bijux-proteomics/operations/release-and-versioning.md
        bijux-proteomics/architecture-invariants.md: 01-bijux-proteomics/foundation/change-principles.md
        bijux-proteomics/design-debt-ledger.md: 01-bijux-proteomics/operations/change-management.md
        bijux-proteomics/dependency-allowlist.md: 01-bijux-proteomics/operations/artifact-governance.md
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  homepage: https://bijux.io/
  bijux:
    repository: bijux-proteomics
    docs_package: bijux-proteomics-dev
    nav_mode: default
    theme_key: bijux:theme
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bijux

extra_css:
  - assets/styles/extra.css

extra_javascript:
  - assets/javascripts/vendor/mermaid-11.6.0.min.js
  - assets/javascripts/mermaid-init.js
  - assets/javascripts/shell/theme-persistence.js
  - assets/javascripts/shell/viewport-profile.js
  - assets/javascripts/shell/nav-state.js
  - assets/javascripts/shell/detail-tabs.js
  - assets/javascripts/shell/nav-reveal.js
  - assets/javascripts/shell/bootstrap.js
  - assets/javascripts/navigation-sync.js
  - assets/javascripts/external-links.js

copyright: "© 2026 Bijan Mousavi <bijan@bijux.io>"
