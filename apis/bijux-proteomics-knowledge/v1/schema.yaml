openapi: 3.1.0
info:
  title: bijux-proteomics-knowledge API
  version: v1
  summary: Knowledge package service contract for evidence services.
  description: >
    API contract for knowledge-layer health and readiness signals.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
security: []
paths:
  /health:
    get:
      operationId: knowledgeHealth
      summary: Health check
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: knowledgeReady
      summary: Readiness check
      responses:
        "200":
          description: Service readiness response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [ready, package]
      properties:
        ready:
          type: boolean
        package:
          type: string
          const: bijux-proteomics-knowledge
