openapi: 3.1.0
info:
  title: bijux-proteomics-runtime
  description: HTTP API exposing the same capabilities as the CLI, nothing more.
  version: 2.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health
      description: health.
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /health:
    get:
      tags:
      - health
      summary: Health
      description: health.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/ready:
    get:
      tags:
      - health
      summary: Ready
      description: ready.
      operationId: ready_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /ready:
    get:
      tags:
      - health
      summary: Ready
      description: ready.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /api/v1/run:
    post:
      tags:
      - run
      summary: Run Endpoint
      description: run_endpoint.
      operationId: run_endpoint_api_v1_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/import:
    post:
      tags:
      - import
      summary: Import Endpoint
      description: Import one external-engine result through the canonical runtime
        surface.
      operationId: import_endpoint_api_v1_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/resume:
    post:
      tags:
      - resume
      summary: Resume Endpoint
      description: resume_endpoint.
      operationId: resume_endpoint_api_v1_resume_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inspect/{candidate_id}:
    get:
      tags:
      - inspect
      summary: Inspect Endpoint
      description: inspect_endpoint.
      operationId: inspect_endpoint_api_v1_inspect__candidate_id__get
      parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: string
          title: Candidate Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/compare:
    post:
      tags:
      - compare
      summary: Compare Endpoint
      description: compare_endpoint.
      operationId: compare_endpoint_api_v1_compare_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/runs/{run_id}/status:
    get:
      tags:
      - runtime-contracts
      summary: Run Status Endpoint
      description: Return the stable runtime status contract for one run.
      operationId: run_status_endpoint_api_v1_runs__run_id__status_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: include_documents
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Documents
      - name: max_inline_bytes
        in: query
        required: false
        schema:
          type: integer
          default: 256000
          title: Max Inline Bytes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
  /api/v1/runs/{run_id}/artifacts:
    get:
      tags:
      - runtime-contracts
      summary: Run Artifacts Endpoint
      description: Return the stable artifact inventory for one run.
      operationId: run_artifacts_endpoint_api_v1_runs__run_id__artifacts_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/evidence-bundle:
    get:
      tags:
      - runtime-contracts
      summary: Run Evidence Endpoint
      description: Return the stable evidence-bundle surface for one run.
      operationId: run_evidence_endpoint_api_v1_runs__run_id__evidence_bundle_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: include_document
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Document
      - name: max_inline_bytes
        in: query
        required: false
        schema:
          type: integer
          default: 256000
          title: Max Inline Bytes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/review-packet:
    get:
      tags:
      - runtime-contracts
      summary: Run Review Endpoint
      description: Return the stable review-packet surface for one run.
      operationId: run_review_endpoint_api_v1_runs__run_id__review_packet_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: include_document
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Document
      - name: max_inline_bytes
        in: query
        required: false
        schema:
          type: integer
          default: 256000
          title: Max Inline Bytes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runtime-health:
    get:
      tags:
      - runtime-contracts
      summary: Runtime Health Endpoint
      description: Return the typed runtime health report.
      operationId: runtime_health_endpoint_api_v1_runtime_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/runs/history:
    get:
      tags:
      - runtime-contracts
      summary: Run History Endpoint
      description: Return the stable run-history lookup response.
      operationId: run_history_endpoint_api_v1_runs_history_get
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
      - name: workflow_state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow State
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Outcome
      - name: candidate_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Candidate Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: max_query_cost
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          title: Max Query Cost
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/artifacts:
    get:
      tags:
      - runtime-contracts
      summary: Artifact Lookup Endpoint
      description: Return the stable artifact lookup response.
      operationId: artifact_lookup_endpoint_api_v1_artifacts_get
      parameters:
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
      - name: artifact_kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Kind
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: max_query_cost
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          title: Max Query Cost
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/evidence:
    get:
      tags:
      - runtime-contracts
      summary: Evidence Lookup Endpoint
      description: Return the stable evidence and review lookup response.
      operationId: evidence_lookup_endpoint_api_v1_evidence_get
      parameters:
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
      - name: document_kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Kind
      - name: availability
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Availability
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Page Size
      - name: max_query_cost
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          title: Max Query Cost
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApiCandidate:
      properties:
        candidate_id:
          type: string
          minLength: 1
          title: Candidate Id
          description: Candidate identifier.
        sequence:
          type: string
          minLength: 1
          title: Sequence
          description: Sequence.
        structures:
          items:
            $ref: '#/components/schemas/ApiCandidateStructure'
          type: array
          title: Structures
          description: Structures.
        metrics:
          additionalProperties:
            type: number
          type: object
          title: Metrics
          description: Candidate metrics.
        flags:
          items:
            type: string
          type: array
          title: Flags
          description: Flags.
        provenance:
          additionalProperties: true
          type: object
          title: Provenance
          description: Provenance metadata.
        confidence:
          additionalProperties: true
          type: object
          title: Confidence
          description: Confidence vector.
        created_at:
          type: string
          title: Created At
          description: Created timestamp.
      additionalProperties: false
      type: object
      required:
      - candidate_id
      - sequence
      - created_at
      title: ApiCandidate
      description: ApiCandidate.
    ApiCandidateStructure:
      properties:
        structure_id:
          type: string
          title: Structure Id
          description: Structure identifier.
        provider:
          type: string
          title: Provider
          description: Provider name.
        pdb_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Pdb Text
          description: Optional PDB.
        metrics:
          additionalProperties:
            type: number
          type: object
          title: Metrics
          description: Structure metrics.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Structure metadata.
      additionalProperties: false
      type: object
      required:
      - structure_id
      - provider
      title: ApiCandidateStructure
      description: ApiCandidateStructure.
    ApiEnvelope:
      properties:
        status:
          type: string
          enum:
          - ok
          - error
          title: Status
          description: Response status.
        data:
          anyOf:
          - $ref: '#/components/schemas/RunResponse'
          - $ref: '#/components/schemas/RuntimeStatusResponse'
          - $ref: '#/components/schemas/RunArtifactsResponse'
          - $ref: '#/components/schemas/RunEvidenceResponse'
          - $ref: '#/components/schemas/RunReviewResponse'
          - $ref: '#/components/schemas/RunHistoryResponse'
          - $ref: '#/components/schemas/ArtifactLookupResponse'
          - $ref: '#/components/schemas/EvidenceLookupResponse'
          - $ref: '#/components/schemas/InspectResponse'
          - $ref: '#/components/schemas/CompareResponse'
          - $ref: '#/components/schemas/HealthResponse'
          - $ref: '#/components/schemas/ReadyResponse'
          - $ref: '#/components/schemas/RuntimeHealthResponse'
          - type: 'null'
          title: Data
          description: Successful response payload.
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorResponse'
          - type: 'null'
          description: Structured error payload.
        meta:
          additionalProperties: true
          type: object
          title: Meta
          description: Meta fields.
      additionalProperties: false
      type: object
      required:
      - status
      title: ApiEnvelope
      description: ApiEnvelope.
    ArtifactLookupResponse:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/RuntimeArtifactRecord'
          type: array
          title: Artifacts
          description: Artifacts that match the requested filters.
        page:
          $ref: '#/components/schemas/PaginationMeta'
          description: Pagination and query-cost metadata.
      additionalProperties: false
      type: object
      required:
      - page
      title: ArtifactLookupResponse
      description: Stable cross-run artifact lookup response.
    CompareRequest:
      properties:
        run_id_a:
          type: string
          minLength: 1
          title: Run Id A
          description: First run id.
        run_id_b:
          type: string
          minLength: 1
          title: Run Id B
          description: Second run id.
      additionalProperties: false
      type: object
      required:
      - run_id_a
      - run_id_b
      title: CompareRequest
      description: CompareRequest.
    CompareResponse:
      properties:
        run_ids:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          type: object
          title: Run Ids
          description: Run ids.
        final_outcome:
          additionalProperties:
            additionalProperties: true
            type: object
          type: object
          title: Final Outcome
          description: Final outcome summaries.
        candidate_trajectories:
          additionalProperties: true
          type: object
          title: Candidate Trajectories
          description: Candidate trajectories.
        iteration_deltas:
          additionalProperties: true
          type: object
          title: Iteration Deltas
          description: Iteration deltas.
      additionalProperties: false
      type: object
      required:
      - run_ids
      - final_outcome
      - candidate_trajectories
      - iteration_deltas
      title: CompareResponse
      description: CompareResponse.
    ErrorResponse:
      properties:
        type:
          type: string
          minLength: 1
          format: uri
          title: Type
          description: Problem type URI.
          default: about:blank
        title:
          type: string
          title: Title
          description: Short, human-readable summary.
        status:
          type: integer
          title: Status
          description: HTTP status code.
        detail:
          type: string
          title: Detail
          description: Human-readable explanation.
        instance:
          type: string
          title: Instance
          description: URI reference for this occurrence.
        failure_class:
          type: string
          minLength: 1
          title: Failure Class
          description: Stable failure class.
        remediation_hint:
          type: string
          minLength: 1
          title: Remediation Hint
          description: Operator-facing remediation hint.
        evidence_pointer:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Pointer
          description: Optional path or identifier that points to relevant evidence.
      additionalProperties: false
      type: object
      required:
      - title
      - status
      - detail
      - instance
      - failure_class
      - remediation_hint
      title: ErrorResponse
      description: ErrorResponse.
    EvidenceLookupResponse:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/RuntimeDocumentReference'
          type: array
          title: Documents
          description: Evidence and review documents matching the requested filters.
        page:
          $ref: '#/components/schemas/PaginationMeta'
          description: Pagination and query-cost metadata.
      additionalProperties: false
      type: object
      required:
      - page
      title: EvidenceLookupResponse
      description: Stable cross-run evidence and review lookup response.
    ExecutionStatus:
      type: string
      enum:
      - completed
      - errored
      - aborted
      title: ExecutionStatus
      description: ExecutionStatus.
    FailureType:
      type: string
      enum:
      - none
      - input_invalid
      - invalid_plan
      - capability_missing
      - tool_timeout
      - oom
      - tool_crash
      - tool_failure
      - invalid_output
      - biological_implausibility
      - convergence_failure
      - human_decision_missing
      - unknown
      title: FailureType
      description: FailureType.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Health status.
        runtime:
          type: string
          title: Runtime
          description: Canonical runtime identity.
      additionalProperties: false
      type: object
      required:
      - status
      - runtime
      title: HealthResponse
      description: HealthResponse.
    ImportRequest:
      properties:
        sequence:
          type: string
          minLength: 1
          title: Sequence
          description: Sequence linked to the imported evidence.
        source_path:
          type: string
          minLength: 1
          title: Source Path
          description: External engine result path on server.
        engine_name:
          type: string
          minLength: 1
          title: Engine Name
          description: External engine name.
        engine_version:
          type: string
          minLength: 1
          title: Engine Version
          description: External engine version.
        artifacts_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifacts Dir
          description: Artifacts root.
      additionalProperties: false
      type: object
      required:
      - sequence
      - source_path
      - engine_name
      - engine_version
      title: ImportRequest
      description: ImportRequest.
    InspectResponse:
      properties:
        candidate:
          $ref: '#/components/schemas/ApiCandidate'
          description: Candidate.
        qc_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Qc Status
          description: QC status.
        artifacts:
          additionalProperties:
            type: string
          type: object
          title: Artifacts
          description: Artifact paths.
      additionalProperties: false
      type: object
      required:
      - candidate
      title: InspectResponse
      description: InspectResponse.
    Outcome:
      type: string
      enum:
      - accepted
      - rejected
      - needs_review
      - inconclusive
      title: Outcome
      description: Outcome.
    PaginationMeta:
