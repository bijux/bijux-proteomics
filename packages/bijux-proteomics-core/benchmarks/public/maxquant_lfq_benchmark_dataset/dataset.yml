dataset_id: maxquant_lfq_benchmark_dataset
accession: flagship_public_package:maxquant_lfq_benchmark_dataset
species: human
search_engine: maxquant
source_files:
  - source_id: maxquant_evidence
    schema_id: evidence_txt
    repo_relative_path: packages/bijux-proteomics-core/benchmark-assets/flagship-public-packages/maxquant_lfq_benchmark_dataset/evidence/evidence.txt
    sha256: 87e496f43588f2a6540313f2b7b85ac97c71b9db87170e0a2198b4749adbf53f
