    sha256: e1ba95ae82d3c0d8eb000361756d6f463e6518477145d2802a01fcab6b592451
    note: Shipped study design surface for the runnable MaxQuant LFQ benchmark workflow.
  - source_id: maxquant_settings
    schema_id: config_txt
