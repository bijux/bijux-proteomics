    sha256: 316e724b20c228655b7203dde70f644c55e966e9f74d1be93bcffc0fcbbd6b02
    note: Shipped MaxQuant settings surface paired with the runnable benchmark evidence bundle.
  - source_id: maxquant_support_fasta
