expected_biological_signals: []
known_limitations:
  - limitation_id: bridge_channel_missing_from_reporter_table
    severity: advisory
    affected_surface: result_tsv
    blocks_workflow_execution: false
    description: The shipped reporter table omits the bridge 129N channel even though the governed design declares it, so the workflow carries explicit missing-source-channel pressure across both plexes.
command:
  cli: bijux proteomics public-benchmark-runner packages/bijux-proteomics-core/benchmarks/public/multiplex_tmtpro_review_package/dataset.yml --run-output-root artifacts/public-benchmark-runs
  note: Run the flagship TMTpro reporter-ion table through the owned TMT workflow with channel QC, normalization, ratios, interference review, differential proteins, and report export.
  parameters:
    control_channel: "126"
    source_kind: maxquant
output_checks:
  - output_id: workflow_manifest_json
    relative_path: tmt_workflow_manifest.json
    note: The orchestrator writes this manifest after successful TMT workflow execution.
  - output_id: label_based_report_manifest_json
    relative_path: label_based_report_manifest.json
    note: The owned labeled report export writes this manifest after successful TMT workflow execution.
  - output_id: tmt_validation_summary
    relative_path: tmt_validation_summary.tsv
    note: The exported TMT validation summary proves channel QC was generated.
  - output_id: tmt_normalization_summary
    relative_path: tmt_normalization_summary.tsv
    note: The exported TMT normalization summary proves normalization was generated.
  - output_id: tmt_protein_ratios
    relative_path: tmt_protein_ratios.tsv
    note: The exported TMT protein ratio table proves ratio analysis was generated.
  - output_id: tmt_interference_summary
    relative_path: tmt_interference_summary.tsv
    note: The exported TMT interference summary proves isolation-interference review was generated.
  - output_id: tmt_interference_channel_summary
    relative_path: tmt_interference_channel_summary.tsv
    note: The exported TMT interference channel summary preserves per-sample-channel interference review.
  - output_id: differential_results
    relative_path: label_based_differential_results.tsv
    note: The exported labeled differential table proves protein differential analysis was generated.
  - output_id: label_based_report_summary
    relative_path: label_based_report_summary.tsv
    note: The exported labeled report summary proves the downstream report bundle was generated.
note: The flagship multiplex public package now carries a real TMT reporter-ion table, a governed multiplex design with bridge-channel roles, and the owned workflow outputs needed for channel QC, normalization, ratios, interference analysis, differential proteins, and report export.
