dataset_id: dia_diann_review_snapshot
accession: flagship_public_package:dia_library_review_package/comparator:diann
species: human
search_engine: diann
source_files:
  - source_id: dia_diann_pipeline_export
    schema_id: result_tsv
    repo_relative_path: packages/bijux-proteomics-core/benchmark-assets/flagship-public-packages/dia_library_review_package/comparator/diann_pipeline_export.tsv
    sha256: 4d8e06e9ac5f9d57e861c70e47199149d5cdaddf1738bd90026d463672c9a9d6
    public_reference_url: https://github.com/vdemichev/DiaNN
    note: Shipped DIA-NN comparator export from the flagship DIA public package.
  - source_id: dia_diann_config
    schema_id: config_json
    repo_relative_path: packages/bijux-proteomics-core/benchmark-assets/flagship-public-packages/dia_library_review_package/comparator/diann_config.json
    sha256: 798bc7a878b0e07ac3cdb85c11c884c502bb2ac50220529d1b27a3241b667185
    public_reference_url: https://github.com/vdemichev/DiaNN
    note: Comparator configuration snapshot from the flagship DIA public package.
  - source_id: dia_support_design
    schema_id: design_tsv
    repo_relative_path: packages/bijux-proteomics-core/benchmarks/public/support/diann_biological.design.tsv
    sha256: e7bb7a583caf32dc07c1567f6a410c8f498b5f7580f572caa49864cddb0d4439
    note: Governed support design that makes the public comparator export executable through the owned DIA biology workflow.
