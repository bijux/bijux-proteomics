[build-system]
requires = ["hatchling>=1.27.0,<1.31", "hatch-vcs>=0.4.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-proteomics-core"
dynamic = ["version"]
description = "Protein program domain models, lifecycle gates, and execution interfaces for stage-based discovery workflows"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<4"
authors = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
maintainers = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
keywords = [
  "proteomics",
  "program-modeling",
  "lifecycle",
  "bioinformatics",
  "domain-contracts",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.0.2",
  "numpy>=1.26,<3.0",
  "biopython>=1.83",
  "defusedxml>=0.7.1,<1.0",
  "loguru>=0.7",
  "bijux-proteomics-foundation>=0.3.6",
]

[project.urls]
Homepage = "https://bijux.io/bijux-proteomics/"
Documentation = "https://bijux.io/bijux-proteomics/04-bijux-proteomics-core/"
Repository = "https://github.com/bijux/bijux-proteomics"
Issues = "https://github.com/bijux/bijux-proteomics/issues"
Changelog = "https://github.com/bijux/bijux-proteomics/blob/main/packages/bijux-proteomics-core/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-proteomics/blob/main/SECURITY.md"

[project.scripts]
bijux-proteomics = "bijux_proteomics.interfaces.cli:cli"

[project.optional-dependencies]
parquet = [
  "pyarrow>=16,<25",
]
test = [
  "pytest>=8.4.1,<10.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-benchmark>=4.0.0,<6.0",
  "pytest-timeout>=2.4.0,<3.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
fallback-version = "0.3.6"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = "../..", search_parent_directories = true }

[tool.hatch.build]
include = [
  "README.md",
  "CHANGELOG.md",
  "src/bijux_proteomics/py.typed",
]
force-include = { "LICENSE" = "LICENSE", "NOTICE" = "NOTICE" }

[tool.hatch.build.targets.wheel]
packages = ["src/bijux_proteomics"]

[tool.hatch.build.targets.wheel.package-data]
"bijux_proteomics" = ["py.typed"]

[tool.pytest.ini_options]
markers = [
  "benchmark: performance and benchmark-oriented tests",
  "external_data: tests that exercise checked-in external corpora and bundles",
  "integration: integration tests",
  "unit: marks package-level unit tests",
]

[tool.interrogate]
fail-under = 32
color = true
