[build-system]
requires = ["hatchling>=1.27.0,<1.28"]
build-backend = "hatchling.build"

[project]
name = "bijux-proteomics-intelligence"
version = "0.3.0"
description = "Policy-driven candidate ranking and scenario decision intelligence for protein progression and portfolio prioritization"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
maintainers = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
keywords = [
  "proteomics",
  "candidate-ranking",
  "decision-intelligence",
  "policy-engine",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0.2",
  "bijux-proteomics-foundation>=0.3.0",
  "bijux-proteomics-core>=0.3.0",
  "bijux-proteomics-knowledge>=0.3.0",
]

[project.urls]
Homepage = "https://bijux.io/bijux-proteomics/"
Documentation = "https://bijux.io/bijux-proteomics/"
Repository = "https://github.com/bijux/bijux-proteomics"
Issues = "https://github.com/bijux/bijux-proteomics/issues"
Changelog = "https://github.com/bijux/bijux-proteomics/blob/main/packages/bijux-proteomics-intelligence/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-proteomics/blob/main/SECURITY.md"

[tool.hatch.build]
include = [
  "README.md",
  "CHANGELOG.md",
  "docs/maintainer/pypi.md",
  "src/bijux_proteomics_intelligence/py.typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bijux_proteomics_intelligence"]

[tool.hatch.build.targets.wheel.package-data]
"bijux_proteomics_intelligence" = ["py.typed"]
