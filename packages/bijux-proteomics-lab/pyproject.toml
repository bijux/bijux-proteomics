[build-system]
requires = ["hatchling>=1.27.0,<1.33", "hatch-vcs>=0.4.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-proteomics-lab"
dynamic = ["version"]
description = "Assay planning, schedule-aware experiment orchestration, and outcome interpretation for lab-in-the-loop proteomics"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<4"
authors = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
maintainers = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
keywords = [
  "proteomics",
  "lab-planning",
  "experiment-scheduling",
  "assay-operations",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0.2",
  "bijux-proteomics-foundation>=0.3.8",
  "bijux-proteomics-core>=0.3.8",
  "bijux-proteomics-knowledge>=0.3.8",
]

[project.urls]
Homepage = "https://bijux.io/bijux-proteomics/"
Documentation = "https://bijux.io/bijux-proteomics/07-bijux-proteomics-lab/"
Repository = "https://github.com/bijux/bijux-proteomics"
Issues = "https://github.com/bijux/bijux-proteomics/issues"
Changelog = "https://github.com/bijux/bijux-proteomics/blob/main/packages/bijux-proteomics-lab/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-proteomics/blob/main/SECURITY.md"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
fallback-version = "0.3.8"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = "../..", search_parent_directories = true }

[tool.hatch.build]
include = [
  "README.md",
  "CHANGELOG.md",
  "src/bijux_proteomics_lab/py.typed",
]
force-include = { "LICENSE" = "LICENSE", "NOTICE" = "NOTICE" }

[tool.hatch.build.targets.wheel]
packages = ["src/bijux_proteomics_lab"]

[tool.hatch.build.targets.wheel.package-data]
"bijux_proteomics_lab" = ["py.typed"]
