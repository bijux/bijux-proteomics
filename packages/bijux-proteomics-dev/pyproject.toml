[build-system]
requires = ["hatchling>=1.27.0,<1.32", "hatch-vcs>=0.4.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-proteomics-dev"
dynamic = ["version"]
description = "Monorepo developer toolkit for quality gates, security checks, release validation, and API schema governance"
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "Apache-2.0" }
authors = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
maintainers = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "agentic-proteins>=0.3.8",
  "biopython>=1.85,<2.0",
  "huggingface-hub>=0.24,<2.0",
  "idna>=3.15,<4.0",
  "packaging>=24.0,<27.0",
  "PyYAML>=6.0,<7.0",
  "requests>=2.32,<3.0",
  "urllib3>=2.7.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/bijux/bijux-proteomics/tree/main/packages/bijux-proteomics-dev"
Repository = "https://github.com/bijux/bijux-proteomics"
Documentation = "https://bijux.io/bijux-proteomics/08-bijux-proteomics-maintain/bijux-proteomics-dev/"
Issues = "https://github.com/bijux/bijux-proteomics/issues"
Changelog = "https://github.com/bijux/bijux-proteomics/blob/main/packages/bijux-proteomics-dev/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-proteomics/blob/main/SECURITY.md"

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-timeout>=2.4.0,<3.0",
]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-benchmark>=4.0.0,<6.0",
  "pytest-cov>=6.2.1,<8.0",
  "pytest-timeout>=2.4.0,<3.0",
  "hypothesis>=6.112,<7.0",
  "hatch>=1.14.0,<2.0",
  "pydantic>=2.12,<3.0",
  "ruff>=0.6.8,<1.0",
  "mypy>=1.11.2,<3.0",
  "pyright>=1.1.390,<2.0",
  "radon>=6.0.1,<7.0",
  "vulture>=2.7,<3.0",
  "deptry>=0.10.0,<1.0",
  "interrogate>=1.7.0,<2.0",
  "bandit>=1.7.10,<2.0",
  "pip-audit>=2.7.3,<3.0",
  "build>=1.0.3,<2.0",
  "codespell>=2.3.0,<3.0",
  "pydocstyle>=6.3.0,<7.0",
  "mkdocs>=1.6.1,<2.0",
  "mkdocs-material>=9.5.39,<10.0",
  "mkdocs-autorefs>=1.4.4,<2.0",
  "mkdocs-redirects>=1.2,<2.0",
  "mkdocs-git-revision-date-localized-plugin>=1.2.0,<2.0",
  "msgpack>=1.2.1,<2.0",
  "gitpython>=3.1.55,<4.0",
  "pymdown-extensions>=11.0.1,<12.0",
  "starlette>=1.3.1,<2.0",
  "types-PyYAML>=6.0.12,<7.0",
  "types-defusedxml>=0.7.0,<1.0",
  "types-requests>=2.32.0,<3.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = "../..", search_parent_directories = true }
fallback-version = "0.3.8"

[tool.hatch.build.targets.wheel]
packages = ["src/bijux_proteomics_dev"]
include = ["src/bijux_proteomics_dev/py.typed"]

[tool.hatch.build.targets.wheel.package-data]
"bijux_proteomics_dev" = ["py.typed"]

[tool.hatch.build]
include = [
  "CHANGELOG.md",
  "README.md",
  "src/bijux_proteomics_dev/**",
]
force-include = { "LICENSE" = "LICENSE", "NOTICE" = "NOTICE" }

[tool.interrogate]
fail-under = 32
verbose = 0
ignore-init-method = true
ignore-private = true
ignore-semiprivate = true

[tool.pytest.ini_options]
markers = [
  "benchmark: performance and benchmark-oriented tests",
  "external_data: tests that exercise checked-in external corpora and bundles",
  "governance: repository governance and inventory freshness tests",
  "slow: mark test as slow",
  "unit: unit tests",
]
