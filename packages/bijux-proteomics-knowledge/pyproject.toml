[build-system]
requires = ["hatchling>=1.27.0,<1.33", "hatch-vcs>=0.4.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-proteomics-knowledge"
dynamic = ["version"]
description = "Evidence, trust, and contradiction-resolution models for auditable proteomics decision knowledge graphs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<4"
authors = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
maintainers = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
keywords = [
  "proteomics",
  "evidence-graph",
  "trust-scoring",
  "knowledge-governance",
  "conflict-resolution",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0.2",
  "bijux-proteomics-foundation>=0.3.8",
  "bijux-proteomics-core>=0.3.8",
]

[project.urls]
Homepage = "https://bijux.io/bijux-proteomics/"
Documentation = "https://bijux.io/bijux-proteomics/06-bijux-proteomics-knowledge/"
Repository = "https://github.com/bijux/bijux-proteomics"
Issues = "https://github.com/bijux/bijux-proteomics/issues"
Changelog = "https://github.com/bijux/bijux-proteomics/blob/main/packages/bijux-proteomics-knowledge/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-proteomics/blob/main/SECURITY.md"

[project.optional-dependencies]
test = [
  "pytest>=8.4.1,<10.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-benchmark>=4.0.0,<6.0",
  "pytest-timeout>=2.4.0,<3.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
fallback-version = "0.3.8"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = "../..", search_parent_directories = true }

[tool.hatch.build]
include = [
  "README.md",
  "CHANGELOG.md",
  "src/bijux_proteomics_knowledge/py.typed",
]
force-include = { "LICENSE" = "LICENSE", "NOTICE" = "NOTICE" }

[tool.hatch.build.targets.wheel]
packages = ["src/bijux_proteomics_knowledge"]

[tool.hatch.build.targets.wheel.package-data]
"bijux_proteomics_knowledge" = ["py.typed"]
