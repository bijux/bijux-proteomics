[build-system]
requires = [
  "hatchling>=1.30.1,<1.33",
  "hatch-fancy-pypi-readme>=25.1.0,<26.0",
  "hatch-vcs>=0.5.0,<1.0",
]
build-backend = "hatchling.build"

[project]
name = "agentic-proteins"
dynamic = ["version"]
description = "Legacy compatibility bridge for historical runtime entrypoints, imports, and migration-safe CLI continuity."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<4"
authors = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
maintainers = [{ name = "Bijan Mousavi", email = "bijan@bijux.io" }]
keywords = [
  "proteomics",
  "runtime",
  "compatibility",
  "migration",
  "forwarding",
]
dependencies = [
  "bijux-proteomics-core>=0.3.8,<0.4.0",
  "bijux-proteomics-runtime>=0.3.8,<0.4.0",
]

[project.urls]
Homepage = "https://bijux.io/bijux-proteomics/"
Website = "https://bijux.io/"
Documentation = "https://bijux.io/bijux-proteomics/02-agentic-proteins/"
Repository = "https://github.com/bijux/bijux-proteomics"
Issues = "https://github.com/bijux/bijux-proteomics/issues"
Changelog = "https://github.com/bijux/bijux-proteomics/blob/main/packages/agentic-proteins/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-proteomics/blob/main/SECURITY.md"

[project.scripts]
agentic-proteins = "agentic_proteins.interfaces.cli:cli"

[project.optional-dependencies]
api = [
  "bijux-proteomics-runtime[api]>=0.3.8,<0.4.0",
]
test = [
  "pytest>=9.1.1,<10.0",
  "pytest-asyncio>=1.4.0,<2.0",
  "pytest-timeout>=2.4.0,<3.0",
  "httpx>=0.28.1,<1.0",
]
local-esmfold = [
  "bijux-proteomics-runtime[local-esmfold]>=0.3.8,<0.4.0",
]
local-rosettafold = [
  "bijux-proteomics-runtime[local-rosettafold]>=0.3.8,<0.4.0",
]
nl = [
  "bijux-proteomics-runtime[nl]>=0.3.8,<0.4.0",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
fallback-version = "0.3.8"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = "../..", search_parent_directories = true }

[tool.hatch.build]
include = [
  "README.md",
  "CHANGELOG.md",
  "src/agentic_proteins/py.typed",
]
force-include = { "LICENSE" = "LICENSE", "NOTICE" = "NOTICE" }

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_proteins"]
zip-safe = false

[tool.hatch.build.targets.wheel.package-data]
"agentic_proteins" = ["py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "CHANGELOG.md",
  "src/agentic_proteins/**",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [
  { path = "README.md" },
  { path = "CHANGELOG.md" },
]
