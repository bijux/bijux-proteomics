INHERIT: mkdocs.shared.yml

site_name: Bijux Proteomics
site_description: Deterministic protein runtime, program design, intelligence, evidence, and lab orchestration documentation for the Bijux Proteomics package system.
site_author: Bijan Mousavi <bijan@bijux.io>
site_url: !ENV [SITE_URL, https://bijux.io/bijux-proteomics/]
repo_name: bijux/bijux-proteomics
repo_url: https://github.com/bijux/bijux-proteomics
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: artifacts/root/docs/site
watch:
  - docs
  - docs/assets
  - docs/overrides
  - .bijux/shared/bijux-docs
  - mkdocs.yml
  - mkdocs.shared.yml
  - packages/bijux-proteomics-dev/src/bijux_proteomics_dev/docs

theme:
  custom_dir: docs/overrides

# MkDocs replaces inherited plugin lists instead of merging them, so the
# repository-owned redirects live alongside the shared baseline plugins here.
plugins:
  - search
  - autorefs
  - redirects:
      redirect_maps:
        bijux-proteomics-dev/index.md: 08-bijux-proteomics-maintain/index.md
