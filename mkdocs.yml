INHERIT: mkdocs.shared.yml

site_name: Bijux Proteomics
site_description: Deterministic protein runtime, program design, intelligence, evidence, and lab orchestration documentation for the Bijux Proteomics package system.
site_author: Bijan Mousavi <bijan@bijux.io>
site_url: !ENV [SITE_URL, https://bijux.io/bijux-proteomics/]
repo_name: bijux/bijux-proteomics
repo_url: https://github.com/bijux/bijux-proteomics
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: artifacts/root/docs/site
watch:
  - docs
  - docs/assets
  - docs/overrides
  - mkdocs.yml
  - mkdocs.shared.yml
  - packages/bijux-proteomics-dev/src/bijux_proteomics_dev/docs

theme:
  custom_dir: docs/overrides

extra:
  bijux:
    repository: bijux-proteomics
    docs_package: bijux-proteomics-dev
    nav_mode: default
    theme_key: bijux:theme
    hub_links:
      - key: bijux
        label: Bijux
        url: https://bijux.io/
      - key: bijux-core
        label: Core
        url: https://bijux.io/bijux-core/
      - key: bijux-canon
        label: Canon
        url: https://bijux.io/bijux-canon/
      - key: bijux-atlas
        label: Atlas
        url: https://bijux.io/bijux-atlas/
      - key: bijux-proteomics
        label: Proteomics
        url: https://bijux.io/bijux-proteomics/
      - key: bijux-pollenomics
        label: Pollenomics
        url: https://bijux.io/bijux-pollenomics/
      - key: bijux-masterclass
        label: Masterclass
        url: https://bijux.io/bijux-masterclass/

