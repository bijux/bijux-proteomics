[tox]
minversion = 4.11
requires =
    tox>=4.11
    tox-gh-actions>=3.1
isolated_build = true
skip_missing_interpreters = true
toxworkdir = {tox_root}/artifacts/root/tox
envlist =
    security
    test-{dev,runtime,core,foundation,intelligence,knowledge,lab,agentic}
    security-{dev,runtime,core,foundation,intelligence,knowledge,lab,agentic}
    build-{dev,runtime,core,foundation,intelligence,knowledge,lab,agentic}
    sbom-{dev,runtime,core,foundation,intelligence,knowledge,lab,agentic}
    api-{runtime,core,foundation,intelligence,knowledge,lab,agentic}
    docs

[gh-actions]
python =
    3.11: security, docs, test-dev, test-runtime, test-core, test-foundation, test-intelligence, test-knowledge, test-lab, test-agentic, security-dev, security-runtime, security-core, security-foundation, security-intelligence, security-knowledge, security-lab, security-agentic, build-dev, build-runtime, build-core, build-foundation, build-intelligence, build-knowledge, build-lab, build-agentic, sbom-dev, sbom-runtime, sbom-core, sbom-foundation, sbom-intelligence, sbom-knowledge, sbom-lab, sbom-agentic, api-runtime, api-core, api-foundation, api-intelligence, api-knowledge, api-lab, api-agentic

[testenv]
package = skip
basepython = python3.11
skip_install = true
allowlist_externals = make
change_dir = {env:PACKAGE_DIR}
setenv =
    MONOREPO_ROOT = {tox_root}
    MAKEFLAGS = VENV={envdir} ACT={envdir}/bin
    PIP_DISABLE_PIP_VERSION_CHECK = 1
    PYTHONDONTWRITEBYTECODE = 1
    INSTALL_EXTRAS = dev

    dev: PACKAGE_MAKEFILE = {tox_root}/makes/packages/bijux-proteomics-dev.mk
    runtime: PACKAGE_MAKEFILE = {tox_root}/makes/packages/bijux-proteomics-runtime.mk
    core: PACKAGE_MAKEFILE = {tox_root}/makes/packages/bijux-proteomics-core.mk
    foundation: PACKAGE_MAKEFILE = {tox_root}/makes/packages/bijux-proteomics-foundation.mk
    intelligence: PACKAGE_MAKEFILE = {tox_root}/makes/packages/bijux-proteomics-intelligence.mk
    knowledge: PACKAGE_MAKEFILE = {tox_root}/makes/packages/bijux-proteomics-knowledge.mk
    lab: PACKAGE_MAKEFILE = {tox_root}/makes/packages/bijux-proteomics-lab.mk
    agentic: PACKAGE_MAKEFILE = {tox_root}/makes/packages/agentic-proteins.mk

    dev: PACKAGE_DIR = {tox_root}/packages/bijux-proteomics-dev
    runtime: PACKAGE_DIR = {tox_root}/packages/bijux-proteomics-runtime
    core: PACKAGE_DIR = {tox_root}/packages/bijux-proteomics-core
    foundation: PACKAGE_DIR = {tox_root}/packages/bijux-proteomics-foundation
    intelligence: PACKAGE_DIR = {tox_root}/packages/bijux-proteomics-intelligence
    knowledge: PACKAGE_DIR = {tox_root}/packages/bijux-proteomics-knowledge
    lab: PACKAGE_DIR = {tox_root}/packages/bijux-proteomics-lab
    agentic: PACKAGE_DIR = {tox_root}/packages/agentic-proteins

    runtime: API_DIR = {tox_root}/apis/bijux-proteomics-runtime
    core: API_DIR = {tox_root}/apis/bijux-proteomics-core
    foundation: API_DIR = {tox_root}/apis/bijux-proteomics-foundation
    intelligence: API_DIR = {tox_root}/apis/bijux-proteomics-intelligence
    knowledge: API_DIR = {tox_root}/apis/bijux-proteomics-knowledge
    lab: API_DIR = {tox_root}/apis/bijux-proteomics-lab
    agentic: API_DIR = {tox_root}/apis/agentic-proteins
passenv =
    CI
    GITHUB_*
    GITLAB_*
    PIP_INDEX_URL
    PIP_EXTRA_INDEX_URL
    HTTP_PROXY
    HTTPS_PROXY
    NO_PROXY
    SSH_AUTH_SOCK
    LC_ALL
    LANG
    TC_BASE
    SBOM_CLI
    OPENAPI_GENERATOR_VERSION
    API_HOST
    API_PORT
    API_BASE_PATH
    API_FACTORY
commands_pre =
    python -m pip install -U "pip>=25.3,<26"
    make -f {env:PACKAGE_MAKEFILE} install EXTRAS={env:INSTALL_EXTRAS} PACKAGE_INSTALL_SPEC=.[{env:INSTALL_EXTRAS}]
    security: python -m pip install -U "pip>=25.3,<26"
commands =
    test: make -f {env:PACKAGE_MAKEFILE} test-ci
    lint: make -f {env:PACKAGE_MAKEFILE} lint
    quality: make -f {env:PACKAGE_MAKEFILE} quality
    security: make -f {env:PACKAGE_MAKEFILE} security
    build: make -f {env:PACKAGE_MAKEFILE} build
    sbom: make -f {env:PACKAGE_MAKEFILE} sbom
    api: make -f {env:PACKAGE_MAKEFILE} api

[testenv:security]
package = skip
basepython = python3.11
allowlist_externals = make
change_dir = {tox_root}
setenv =
    MAKEFLAGS =
    PIP_DISABLE_PIP_VERSION_CHECK = 1
    PYTHONDONTWRITEBYTECODE = 1
commands_pre =
    python -m pip install -U "pip>=25.3,<26"
commands =
    make security

[testenv:docs]
package = skip
basepython = python3.11
allowlist_externals = make
change_dir = {tox_root}
commands_pre =
    python -m pip install -U "pip>=25.3,<26"
commands =
    make docs
