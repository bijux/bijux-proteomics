[build-system]
requires = ["hatchling>=1.27.0,<1.32", "hatch-vcs>=0.4.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-proteomics-repository"
description = "Repository workspace for bijux-proteomics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.urls]
Documentation = "https://bijux.io/bijux-proteomics/"
Repository = "https://github.com/bijux/bijux-proteomics"
Issues = "https://github.com/bijux/bijux-proteomics/issues"

[dependency-groups]
test = [
  "agentic-proteins[test]",
  "bijux-proteomics",
  "bijux-proteomics-dev[test]",
  "bijux-proteomics-foundation[test]",
  "bijux-proteomics-core[test]",
  "bijux-proteomics-runtime[test]",
  "bijux-proteomics-intelligence",
  "bijux-proteomics-knowledge[test]",
  "bijux-proteomics-lab",
  "proteomics",
  "proteomics-core",
  "proteomics-foundation",
  "proteomics-runtime",
  "proteomics-intelligence",
  "proteomics-knowledge",
  "proteomics-lab",
]
dev = [
  "agentic-proteins",
  "bijux-proteomics",
  "bijux-proteomics-dev",
  "bijux-proteomics-foundation",
  "bijux-proteomics-core",
  "bijux-proteomics-runtime",
  "bijux-proteomics-intelligence",
  "bijux-proteomics-knowledge",
  "bijux-proteomics-lab",
  "proteomics",
  "proteomics-core",
  "proteomics-foundation",
  "proteomics-runtime",
  "proteomics-intelligence",
  "proteomics-knowledge",
  "proteomics-lab",
  "types-PyYAML>=6.0.12,<7.0",
  "PyYAML>=6.0,<7.0",
  "types-orjson>=3.6.0,<4.0",
  "types-colorama>=0.0.14,<1.0",
  "types-psutil>=6.0.0,<8.0",
  "typing-extensions>=4.5.0,<5.0",
  "types-pexpect>=4.9.0,<5.0",
  "types-requests>=2.32.0,<3.0",
  "types-defusedxml>=0.7.0,<1.0",
  "pytest>=8.4.1,<10.0",
  "pytest-cov>=6.2.1,<8.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-timeout>=2.4.0,<3.0",
  "pytest-rerunfailures>=13.0,<17.0",
  "pytest-benchmark>=4.0.0,<6.0",
  "pytest-mock>=3.14.1,<4.0",
  "hypothesis>=6.103.0,<7.0",
  "hypothesis-jsonschema>=0.23.0,<1.0",
  "pexpect>=4.8.0,<5.0",
  "pyfakefs>=5.9.0",
  "httpx>=0.27.0,<1.0",
  "ruff>=0.6.8,<1.0",
  "mypy>=1.11.2,<3.0",
  "pyright>=1.1.409,<2.0",
  "pytype>=2024.10.11",
  "codespell>=2.3.0,<3.0",
  "pydocstyle>=6.2.1,<7.0",
  "radon>=6.0.0",
  "vulture>=2.7,<3.0",
  "deptry>=0.10.0,<1.0",
  "build>=1.0.3,<2.0",
  "bandit>=1.7.10,<2.0",
  "pip-audit>=2.7.3,<3.0",
  "interrogate>=1.7.0,<2.0",
  "mkdocs>=1.6.1,<2.0",
  "mkdocs-material>=9.5.39,<10.0",
  "mkdocs-autorefs>=1.1.0,<2.0",
  "mkdocs-redirects>=1.2.1,<2.0",
  "mkdocs-git-revision-date-localized-plugin>=1.4.0,<2.0",
  "gitpython>=3.1.57,<4.0",
  "arq>=0.18",
  "PyJWT>=2.13.0,<3.0",
  "prance>=23.6.21.0",
  "openapi-spec-validator>=0.7.1",
  "twine>=6.1.0,<8.0",
]
local-esmfold = [
  "transformers>=5.0.0rc3",
  "tokenizers>=0.14",
  "einops>=0.7",
]
local-rosettafold = []
nl = [
  "langchain-core>=1.3.3",
  "langchain-community>=0.3.27",
  "langchain-huggingface>=1.2.1",
  "langchain-text-splitters>=1.1.2",
  "langsmith>=0.8.0",
]
api = [
  "openprotein-python>=0.8.8",
]

[tool.bijux_proteomics]
api_dir = "apis"
packages = [
  "agentic-proteins",
  "bijux-proteomics-dev",
  "bijux-proteomics-foundation",
  "bijux-proteomics-core",
  "bijux-proteomics-runtime",
  "bijux-proteomics-intelligence",
  "bijux-proteomics-knowledge",
  "bijux-proteomics-lab",
  "bijux-proteomics",
  "proteomics",
  "proteomics-core",
  "proteomics-foundation",
  "proteomics-runtime",
  "proteomics-intelligence",
  "proteomics-knowledge",
  "proteomics-lab",
]
badge_packages = [
  "agentic-proteins",
  "bijux-proteomics-foundation",
  "bijux-proteomics-core",
  "bijux-proteomics-runtime",
  "bijux-proteomics-intelligence",
  "bijux-proteomics-knowledge",
  "bijux-proteomics-lab",
]
docs_package = "bijux-proteomics-dev"
config_dir = "configs"
make_dir = "makes"

[tool.uv.sources]
agentic-proteins = { workspace = true }
bijux-proteomics = { workspace = true }
bijux-proteomics-dev = { workspace = true }
bijux-proteomics-foundation = { workspace = true }
bijux-proteomics-core = { workspace = true }
bijux-proteomics-runtime = { workspace = true }
bijux-proteomics-intelligence = { workspace = true }
bijux-proteomics-knowledge = { workspace = true }
bijux-proteomics-lab = { workspace = true }
proteomics = { workspace = true }
proteomics-core = { workspace = true }
proteomics-foundation = { workspace = true }
proteomics-runtime = { workspace = true }
proteomics-intelligence = { workspace = true }
proteomics-knowledge = { workspace = true }
proteomics-lab = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.interrogate]
fail-under = 45
color = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "packages/agentic-proteins/tests",
  "packages/bijux-proteomics/tests",
  "packages/bijux-proteomics-core/tests",
  "packages/bijux-proteomics-dev/tests",
  "packages/bijux-proteomics-foundation/tests",
  "packages/bijux-proteomics-intelligence/tests",
  "packages/bijux-proteomics-knowledge/tests",
  "packages/bijux-proteomics-lab/tests",
  "packages/bijux-proteomics-runtime/tests",
  "packages/proteomics/tests",
  "packages/proteomics-core/tests",
  "packages/proteomics-foundation/tests",
  "packages/proteomics-intelligence/tests",
  "packages/proteomics-knowledge/tests",
  "packages/proteomics-lab/tests",
  "packages/proteomics-runtime/tests",
]
pythonpath = [
  "packages/agentic-proteins/src",
  "packages/bijux-proteomics/src",
  "packages/bijux-proteomics-core/src",
  "packages/bijux-proteomics-dev/src",
  "packages/bijux-proteomics-foundation/src",
  "packages/bijux-proteomics-intelligence/src",
  "packages/bijux-proteomics-knowledge/src",
  "packages/bijux-proteomics-lab/src",
  "packages/bijux-proteomics-runtime/src",
  "packages/proteomics/src",
  "packages/proteomics-core/src",
  "packages/proteomics-foundation/src",
  "packages/proteomics-intelligence/src",
  "packages/proteomics-knowledge/src",
  "packages/proteomics-lab/src",
  "packages/proteomics-runtime/src",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
cache_dir = "artifacts/root/pytest-cache"
timeout = 120
timeout_method = "thread"
timeout_func_only = true
xfail_strict = true
norecursedirs = [
  ".venv",
  ".tox",
  ".pytest_cache",
  ".ruff_cache",
  ".mypy_cache",
  ".hypothesis",
  ".benchmarks",
  "build",
  "dist",
  "htmlcov",
  "docs",
  "artifacts",
  "node_modules",
  "site",
]
addopts = [
  "-ra",
  "--import-mode=importlib",
  "--strict-markers",
  "--tb=short",
  "--benchmark-storage=file://artifacts/root/benchmarks",
]
markers = [
  "api: HTTP API tests (manual, not for CI)",
  "benchmark: performance and benchmark-oriented tests",
  "e2e: end-to-end tests",
  "evaluation: evaluation benchmarks (deterministic, no regressions)",
  "external_data: tests that exercise checked-in external corpora and bundles",
  "governance: repository governance and inventory freshness tests",
  "gpu: requires CUDA",
  "integration: integration tests",
  "live: live provider integration",
  "real: real local model tests (slow, manual, not for CI)",
  "real_local: requires local models or hardware",
  "regression: regression tests",
  "slow: mark test as slow",
  "smoke: smoke tests",
  "unit: unit tests",
  "windows: mark tests for Windows-only",
]
filterwarnings = [
  "ignore:Not saving anything, no benchmarks have been run!",
  "ignore:jsonschema\\.exceptions\\.RefResolutionError is deprecated:DeprecationWarning",
  "ignore:jsonschema\\.exceptions\\.RefResolutionError is deprecated:DeprecationWarning:schemathesis.generation.coverage",
  "ignore:.*forkpty.*:DeprecationWarning",
  "ignore::Bio.BiopythonDeprecationWarning",
  "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning",
  "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning",
  "ignore:'asyncio\\.get_event_loop_policy' is deprecated:DeprecationWarning",
  "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning:anyio._backends._asyncio",
]

[tool.bandit]
skips = ["B404", "B311"]
exclude_dirs = [".venv", "tests", "artifacts", ".pytest_cache", ".ruff_cache"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
update_changelog_on_bump = false

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
fallback-version = "0.3.8"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = ".", search_parent_directories = true }

[tool.hatch.build.targets.wheel]
bypass-selection = true
