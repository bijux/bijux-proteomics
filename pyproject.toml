[build-system]
requires = ["hatchling>=1.27.0,<1.30", "hatch-vcs>=0.4.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-proteomics-repository"
description = "Repository workspace for bijux-proteomics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.urls]
Documentation = "https://bijux.io/bijux-proteomics/"
Repository = "https://github.com/bijux/bijux-proteomics"
Issues = "https://github.com/bijux/bijux-proteomics/issues"

[dependency-groups]
dev = [
  "agentic-proteins",
  "bijux-proteomics-dev",
  "bijux-proteomics-foundation",
  "bijux-proteomics-core",
  "bijux-proteomics-runtime",
  "bijux-proteomics-intelligence",
  "bijux-proteomics-knowledge",
  "bijux-proteomics-lab",
  "types-PyYAML>=6.0.12,<7.0",
  "PyYAML>=6.0,<7.0",
  "types-orjson>=3.6.0,<4.0",
  "types-colorama>=0.0.14,<1.0",
  "types-psutil>=6.0.0,<8.0",
  "typing-extensions>=4.5.0,<5.0",
  "types-pexpect>=4.9.0,<5.0",
  "types-requests>=2.32.0,<3.0",
  "types-defusedxml>=0.7.0,<1.0",
  "pytest>=8.4.1,<10.0",
  "pytest-cov>=6.2.1,<8.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-timeout>=2.4.0,<3.0",
  "pytest-rerunfailures>=13.0,<17.0",
  "pytest-benchmark>=4.0.0,<6.0",
  "pytest-mock>=3.14.1,<4.0",
  "hypothesis>=6.103.0,<7.0",
  "hypothesis-jsonschema>=0.23.0,<1.0",
  "pexpect>=4.8.0,<5.0",
  "pyfakefs>=5.9.0",
  "httpx>=0.27.0,<1.0",
  "ruff>=0.6.8,<1.0",
  "mypy>=1.11.2,<3.0",
  "pytype>=2024.10.11",
  "codespell>=2.3.0,<3.0",
  "pydocstyle>=6.2.1,<7.0",
  "radon>=6.0.0",
  "vulture>=2.7,<3.0",
  "deptry>=0.10.0,<1.0",
  "build>=1.0.3,<2.0",
  "bandit>=1.7.10,<2.0",
  "pip-audit>=2.7.3,<3.0",
  "interrogate>=1.7.0,<2.0",
  "mkdocs>=1.6.1,<2.0",
  "mkdocs-material>=9.5.39,<10.0",
  "mkdocs-autorefs>=1.1.0,<2.0",
  "mkdocs-redirects>=1.2.1,<2.0",
  "mkdocs-git-revision-date-localized-plugin>=1.4.0,<2.0",
  "arq>=0.18",
  "prance>=23.6.21.0",
  "openapi-spec-validator>=0.7.1",
  "twine>=6.1.0,<7.0",
]
local-esmfold = [
  "transformers>=5.0.0rc3",
  "tokenizers>=0.14",
  "torch>=2.8",
  "einops>=0.7",
]
local-rosettafold = [
  "torch>=2.8",
]
nl = [
  "langchain-core>=1.2.22",
  "langchain-community>=0.3.27",
  "langchain-huggingface>=1.2.1",
  "langchain-text-splitters>=1.1.2",
  "langsmith>=0.7.31",
]
api = [
  "openprotein-python>=0.8.8",
]

[tool.bijux_proteomics]
api_dir = "apis"
packages = [
  "agentic-proteins",
  "bijux-proteomics-dev",
  "bijux-proteomics-foundation",
  "bijux-proteomics-core",
  "bijux-proteomics-runtime",
  "bijux-proteomics-intelligence",
  "bijux-proteomics-knowledge",
  "bijux-proteomics-lab",
]
docs_package = "bijux-proteomics-dev"
config_dir = "configs"
make_dir = "makes"

[tool.uv.sources]
agentic-proteins = { workspace = true }
bijux-proteomics-dev = { workspace = true }
bijux-proteomics-foundation = { workspace = true }
bijux-proteomics-core = { workspace = true }
bijux-proteomics-runtime = { workspace = true }
bijux-proteomics-intelligence = { workspace = true }
bijux-proteomics-knowledge = { workspace = true }
bijux-proteomics-lab = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.interrogate]
fail-under = 32
color = true

[tool.bandit]
skips = ["B404", "B311"]
exclude_dirs = [".venv", "tests", "artifacts", ".pytest_cache", ".ruff_cache"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
update_changelog_on_bump = false

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
fallback-version = "0.3.6"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = ".", search_parent_directories = true }

[tool.hatch.build.targets.wheel]
bypass-selection = true
